name: Refresh job dataset

# Rebuilds public/jobs.json once a day so the board picks up new listings
# without anyone touching it. The site reads the dataset at runtime, so a
# commit here is enough for hosts that deploy on push.
on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch listings
        run: bun run ingest
        env:
          CONTACT_EMAIL: khhnabubakar786@gmail.com

      - name: Commit the refreshed dataset
        run: |
          git add public/jobs.json
          if git diff --staged --quiet; then
            echo "Dataset unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "first-rung refresh bot"
          git config user.email "khhnabubakar786@gmail.com"
          git commit -m "chore: refresh job dataset ($(date -u +%Y-%m-%d))"
          git push

      - name: Build the site
        run: bun run build

      - name: Deploy to Cloudflare
        run: bunx wrangler deploy --config wrangler.deploy.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
